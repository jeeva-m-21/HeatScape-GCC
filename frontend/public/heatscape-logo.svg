<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Claude Terracotta Gradient: Warm Clay to Cooling Emerald -->
    <linearGradient id="hs-claude-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A88F" />
      <stop offset="45%" stop-color="#D97757" />
      <stop offset="80%" stop-color="#C15F3C" />
      <stop offset="100%" stop-color="#4EDEA3" />
    </linearGradient>

    <!-- Hex Shield Dark Backdrop -->
    <radialGradient id="hs-hex-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#241814" />
      <stop offset="70%" stop-color="#140D0B" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="hs-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Spatial Cell (100m Grid Precision) -->
  <polygon
    points="24,3 43,13.5 43,34.5 24,45 5,34.5 5,13.5"
    fill="url(#hs-hex-bg)"
    stroke="#3D261E"
    stroke-width="1.2"
  />

  <!-- Subtle Inner Spatial Grid Guideline -->
  <polygon
    points="24,6.5 40,15.5 40,32.5 24,41.5 8,32.5 8,15.5"
    fill="none"
    stroke="#D97757"
    stroke-width="0.75"
    stroke-opacity="0.3"
    stroke-dasharray="2 1.5"
  />

  <!-- Top Thermal Wave -->
  <path
    d="M13,17 C16.5,13 20.5,12.5 24,14 C27.5,15.5 31.5,15 35,12"
    stroke="url(#hs-claude-grad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Central Intersecting HeatScape Monogram (H / S Vector) -->
  <path
    d="M15,19 L15,31 M33,17 L33,29 M15,25 C19,25 21,21 24,21 C27,21 29,25 33,25"
    stroke="url(#hs-claude-grad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom Resilience Wave (Sea Breeze & Urban Canopy) -->
  <path
    d="M14,35 C17.5,32 20.5,33 24,34.5 C27.5,36 30.5,35 34,32"
    stroke="#4EDEA3"
    stroke-width="2"
    stroke-linecap="round"
    stroke-opacity="0.9"
  />

  <!-- Telemetry Sensor Mesh Nodes -->
  <circle cx="24" cy="14" r="2.2" fill="#F2A88F" filter="url(#hs-glow)" />
  <circle cx="15" cy="25" r="1.8" fill="#D97757" />
  <circle cx="33" cy="25" r="1.8" fill="#D97757" />
  <circle cx="24" cy="34.5" r="2" fill="#4EDEA3" />
</svg>
