<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F11"/>
      <stop offset="50%" stop-color="#15181B"/>
      <stop offset="100%" stop-color="#0D0F11"/>
    </linearGradient>

    <!-- Subdued Ambiance -->
    <radialGradient id="glowThermal" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#D97757" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0D0F11" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCool" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#48A982" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#0D0F11" stop-opacity="0"/>
    </radialGradient>

    <!-- Thermal Bar Gradient -->
    <linearGradient id="thermalSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48A982"/>
      <stop offset="35%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#E5534B"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#D97757" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#48A982" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      .font-mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="400" fill="url(#glowThermal)" rx="16"/>
  <rect width="1200" height="400" fill="url(#glowCool)" rx="16"/>
  <rect width="1198" height="398" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="15"/>

  <!-- Subtle Coordinate Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Animated Sinusoidal Thermal Wave Graphic -->
  <path d="M 500,280 C 620,180 720,340 850,220 C 980,100 1080,260 1200,190" fill="none" stroke="url(#waveGrad)" stroke-width="3"/>
  <path d="M 500,300 C 620,200 720,360 850,240 C 980,120 1080,280 1200,210" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Top Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="360" height="28" rx="14" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="16" cy="14" r="3.5" fill="#48A982"/>
    <text x="28" y="18" fill="#F3F4F6" font-size="11" font-weight="600" class="font-mono">GREATER CHENNAI CORPORATION</text>
    <circle cx="255" cy="14" r="2" fill="#64748B"/>
    <text x="265" y="18" fill="#48A982" font-size="11" font-weight="700" class="font-mono">15 ZONES LIVE</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(60, 125)">
    <!-- Logo Symbol -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="12" fill="#1B1F23" stroke="rgba(255,255,255,0.1)"/>
      <path d="M 24 10 L 36 34 L 12 34 Z" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="3.5" fill="#48A982"/>
    </g>
    <!-- Text -->
    <text x="64" y="36" fill="#FFFFFF" font-size="40" font-weight="800" class="font-sans" letter-spacing="-0.03em">
      Heat<tspan fill="#D97757">Scape</tspan>
    </text>
    <text x="0" y="78" fill="#94A3B8" font-size="16" font-weight="400" class="font-sans">
      Spatiotemporal Urban Heat Intelligence, Thermal Risk Observability &amp; Capital Intervention Planner
    </text>
  </g>

  <!-- Live Hotspot Callout Card (Right Side) -->
  <g transform="translate(780, 50)">
    <rect width="360" height="180" rx="12" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Header -->
    <text x="20" y="32" fill="#94A3B8" font-size="10" font-weight="700" class="font-mono" text-transform="uppercase" letter-spacing="0.06em">
      ZONE IX • WARD 118 (TEYNAMPET CORE)
    </text>
    <rect x="270" y="18" width="70" height="20" rx="10" fill="rgba(229,83,75,0.12)" stroke="rgba(229,83,75,0.25)"/>
    <text x="282" y="32" fill="#E5534B" font-size="10" font-weight="700" class="font-mono">CRITICAL</text>

    <!-- Main Temperature -->
    <text x="20" y="80" fill="#FFFFFF" font-size="34" font-weight="800" class="font-sans">
      +2.8°C
    </text>
    <text x="135" y="68" fill="#D97757" font-size="12" font-weight="600" class="font-mono">Surface Anomaly</text>
    <text x="135" y="84" fill="#64748B" font-size="11" class="font-sans">vs 33.4°C City Baseline</text>

    <!-- Metrics Strip -->
    <line x1="20" y1="105" x2="340" y2="105" stroke="rgba(255,255,255,0.06)"/>
    <g transform="translate(20, 120)">
      <text x="0" y="12" fill="#64748B" font-size="10" class="font-mono">TREE CANOPY</text>
      <text x="0" y="30" fill="#48A982" font-size="14" font-weight="700" class="font-mono">4.2%</text>

      <text x="105" y="12" fill="#64748B" font-size="10" class="font-mono">IMPERVIOUS</text>
      <text x="105" y="30" fill="#D97757" font-size="14" font-weight="700" class="font-mono">84%</text>

      <text x="210" y="12" fill="#64748B" font-size="10" class="font-mono">RECOMMENDED</text>
      <text x="210" y="30" fill="#F3F4F6" font-size="13" font-weight="600" class="font-sans">Miyawaki + Cool Roof</text>
    </g>
  </g>

  <!-- Bottom Metric Counters Strip -->
  <g transform="translate(60, 265)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="90" rx="12" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#64748B" font-size="11" font-weight="600" class="font-mono">AREA MONITORED</text>
      <text x="20" y="66" fill="#F3F4F6" font-size="28" font-weight="800" class="font-sans">42,600 <tspan font-size="16" fill="#94A3B8">km²</tspan></text>
      <rect x="20" y="78" width="60" height="2" fill="#48A982" rx="1"/>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(270, 0)">
      <rect width="250" height="90" rx="12" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#64748B" font-size="11" font-weight="600" class="font-mono">SPATIAL RESOLUTION</text>
      <text x="20" y="66" fill="#D97757" font-size="28" font-weight="800" class="font-sans">100m <tspan font-size="16" fill="#94A3B8">Grids</tspan></text>
      <rect x="20" y="78" width="60" height="2" fill="#D97757" rx="1"/>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(540, 0)">
      <rect width="250" height="90" rx="12" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#64748B" font-size="11" font-weight="600" class="font-mono">ACTIVE IOT MESH</text>
      <text x="20" y="66" fill="#48A982" font-size="28" font-weight="800" class="font-sans">842 <tspan font-size="16" fill="#94A3B8">Nodes</tspan></text>
      <rect x="20" y="78" width="60" height="2" fill="#48A982" rx="1"/>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(810, 0)">
      <rect width="270" height="90" rx="12" fill="#15181B" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="#64748B" font-size="11" font-weight="600" class="font-mono">CIVIL TENDER SSR</text>
      <text x="20" y="66" fill="#FFFFFF" font-size="24" font-weight="800" class="font-sans">TN PWD 2024</text>
      <rect x="20" y="78" width="60" height="2" fill="#E5A93C" rx="1"/>
    </g>
  </g>
</svg>
